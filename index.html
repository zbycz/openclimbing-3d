<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Korno rockface — 3D Gaussian Splatting</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed; overflow: hidden;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10; max-width: min(340px, calc(100vw - 24px));
         background: rgba(12, 15, 20, .72); backdrop-filter: blur(8px);
         border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px; padding: 12px 14px; }
  #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #hud p { margin: 0; color: #9aa3ad; font-size: 12.5px; }
  #hud details { margin-top: 8px; }
  #hud summary { cursor: pointer; color: #9aa3ad; font-size: 12.5px; }
  #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12.5px; }
  #hud dt { color: #9aa3ad; } #hud dd { margin: 0; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; place-items: center; gap: 10px;
            text-align: center; z-index: 20; pointer-events: none; }
  #status.hidden { display: none; }
  #bar { width: 220px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #6ea8fe; transition: width .2s; }
  #msg { color: #9aa3ad; font-size: 13px; }
  #msg.error { color: #ff8b8b; max-width: 80vw; pointer-events: auto; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="stage"></div>

<div id="hud">
  <h1>Korno rockface</h1>
  <p>3D Gaussian Splatting from drone photos</p>
  <details>
    <summary>details &amp; controls</summary>
    <dl id="meta"></dl>
    <p style="margin-top:8px">Drag to orbit · right-drag or two fingers to pan · scroll to zoom</p>
  </details>
</div>

<div id="status"><div id="bar"><i></i></div><div id="msg">loading viewer…</div></div>

<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

const params = new URLSearchParams(location.search);
const SPLAT = params.get('url') || 'korno_web.splat';

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const barEl = document.querySelector('#bar i');

const setProgress = (pct, text) => {
  barEl.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (text) msgEl.textContent = text;
};
const fail = (err) => {
  console.error(err);
  document.getElementById('bar').style.display = 'none';
  msgEl.className = 'error';
  msgEl.textContent = 'Could not load the splat: ' + (err && err.message ? err.message : err);
};

const defaults = {
  cameraUp: [0, -1, 0],
  initialCameraPosition: [0, 0, -4],
  initialCameraLookAt: [0, 0, 0],
};

async function loadConfig() {
  try {
    const res = await fetch('viewer-config.json', { cache: 'no-cache' });
    if (!res.ok) return defaults;
    return Object.assign({}, defaults, await res.json());
  } catch {
    return defaults;
  }
}

function fillMeta(cfg) {
  const dl = document.getElementById('meta');
  const rows = {
    file: SPLAT,
    splats: cfg.splatCount ? cfg.splatCount.toLocaleString('en-US') : '—',
    source: '103 drone photos',
  };
  dl.innerHTML = Object.entries(rows)
    .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

const cfg = await loadConfig();
fillMeta(cfg);
setProgress(4, 'loading splats…');

const viewer = new GaussianSplats3D.Viewer({
  rootElement: document.getElementById('stage'),
  cameraUp: cfg.cameraUp,
  initialCameraPosition: cfg.initialCameraPosition,
  initialCameraLookAt: cfg.initialCameraLookAt,
  // GitHub Pages is not cross-origin isolated, so SharedArrayBuffer is unavailable
  sharedMemoryForWorkers: false,
  dynamicScene: false,
  antialiased: true,
  showLoadingUI: false,
  useBuiltInControls: true,
});

try {
  await viewer.addSplatScene(SPLAT, {
    splatAlphaRemovalThreshold: 5,
    showLoadingUI: false,
    progressiveLoad: true,
    onProgress: (pct, msg, stage) => setProgress(pct, msg || 'loading splats…'),
  });
  statusEl.classList.add('hidden');
  viewer.start();
} catch (err) {
  fail(err);
}
</script>
</body>
</html>
