<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Korno rockface v3 — streaming</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🧗%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed; overflow: hidden;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10; max-width: min(340px, calc(100vw - 24px));
         background: rgba(12, 15, 20, .72); backdrop-filter: blur(8px);
         border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px; padding: 12px 14px; }
  #hudhead { display: flex; align-items: center; gap: 10px; }
  #hud h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
  #collapse { background: none; border: 0; color: #9aa3ad; font-size: 15px; line-height: 1;
              cursor: pointer; padding: 2px 4px; border-radius: 5px; transition: transform .18s; }
  #collapse:hover { color: #e8eaed; background: rgba(255,255,255,.08); }
  #hud.collapsed #hudbody { display: none; }
  #hud.collapsed #collapse { transform: rotate(-90deg); }
  #hudbody > p:first-child { margin-top: 4px; }
  #hud p { margin: 0; color: #9aa3ad; font-size: 12.5px; }
  #hud label { display: block; margin-top: 9px; color: #c8cdd3; font-size: 12.5px; cursor: pointer;
               user-select: none; }
  #hud label#unconfirmedRow,
  #hud label#routeNamesRow { margin-top: 3px; margin-left: 16px; color: #9aa3ad; }
  #hud input { vertical-align: middle; margin-right: 6px; }
  #hint { margin-top: 9px; color: #6b7480; font-size: 12px; }
  #stream { margin-top: 10px; border-top: 1px solid rgba(255,255,255,.09); padding-top: 8px;
            color: #6b7480; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  #stream b { color: #9aa3ad; font-weight: 600; }
  #stream a { color: #8fb3e8; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; place-items: center; gap: 10px;
            text-align: center; z-index: 20; pointer-events: none; }
  #status.hidden { display: none; }
  #bar { width: 220px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #6ea8fe; transition: width .2s; }
  #msg { color: #9aa3ad; font-size: 13px; }
  #msg.error { color: #ff8b8b; max-width: 80vw; pointer-events: auto; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<canvas id="labels"></canvas>

<div id="hud">
  <div id="hudhead">
    <h1>Korno rockface</h1>
    <button id="collapse" title="collapse" aria-expanded="true">&#9662;</button>
  </div>
  <div id="hudbody">
  <p id="sub">streaming the full 17 M mesh</p>
  <label><input type="checkbox" id="routes" checked> show climbing routes</label>
  <label id="routeNamesRow"><input type="checkbox" id="routeNames" checked> &nbsp;grades</label>
  <label><input type="checkbox" id="bolts"> show bolts</label>
  <label id="unconfirmedRow"><input type="checkbox" id="unconfirmed"> &nbsp;include unconfirmed</label>
  <label><input type="checkbox" id="cams"> show camera positions</label>
  <label><input type="checkbox" id="lit" checked> studio light</label>
  <label><input type="checkbox" id="invert"> invert mouse axes</label>
  <p id="hint">Drag to orbit · right-drag to pan · scroll to zoom<br>Click a grade to open its route</p>
  <div id="stream"></div>
  </div>
</div>

<div id="status"><div id="bar"><i></i></div><div id="msg">loading…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const params = new URLSearchParams(location.search);
// Where the tile pyramid lives. It is ~half a gigabyte, so it is deliberately not in this repo and
// not on Pages — it is served from filehost.openclimbing.org. Override with ?tiles=https://host/path/.
// That host must send CORS headers (Access-Control-Allow-Origin), because the textures are loaded
// through WebGL and the geometry through fetch().
const TILE_BASE = (params.get('tiles') ||
  'https://filehost.openclimbing.org/korno-tiles/').replace(/\/?$/, '/');
// pixels of screen-space error a tile may show before the viewer refines into its children
const MAX_SSE = Number(params.get('sse')) || 1.5;
const MAX_INFLIGHT = 6;
const EVICT_AFTER = 25000;      // ms a tile may stay unused before its GPU memory is released

const hud = document.getElementById('hud');
const collapseBtn = document.getElementById('collapse');
const applyCollapse = on => {
  hud.classList.toggle('collapsed', on);
  collapseBtn.setAttribute('aria-expanded', String(!on));
  collapseBtn.title = on ? 'expand' : 'collapse';
};
applyCollapse(localStorage.getItem('korno.hud') === 'collapsed');
collapseBtn.addEventListener('click', () => {
  const on = !hud.classList.contains('collapsed');
  applyCollapse(on);
  localStorage.setItem('korno.hud', on ? 'collapsed' : 'open');
});

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const barEl = document.querySelector('#bar i');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const invertBox = document.getElementById('invert');
const applyInvert = on => { controls.rotateSpeed = on ? -1 : 1; };
invertBox.checked = localStorage.getItem('korno.invert') === '1';
applyInvert(invertBox.checked);
invertBox.addEventListener('change', e => {
  applyInvert(e.target.checked);
  localStorage.setItem('korno.invert', e.target.checked ? '1' : '0');
});

// the texture already carries the daylight it was shot in, so keep the added light gentle
const hemi = new THREE.HemisphereLight(0xffffff, 0x40505f, 2.0);
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(0.6, 1.2, -1.4);
scene.add(hemi, dir);

const meshes = [];
let LIT = true;                     // tiles arrive continuously, so new ones must match the toggle
document.getElementById('lit').addEventListener('change', e => {
  const on = LIT = e.target.checked;
  hemi.intensity = on ? 2.0 : 0;
  dir.intensity = on ? 1.1 : 0;
  meshes.forEach(m => {
    m.material.emissive = new THREE.Color(on ? 0x000000 : 0xffffff);
    m.material.emissiveMap = on ? null : m.material.map;
    m.material.needsUpdate = true;
  });
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  for (const m of lineMaterials) m.resolution.set(innerWidth, innerHeight);
  sizeLabels();
});

// ---- route overlay --------------------------------------------------------
const routeGroup = new THREE.Group();
scene.add(routeGroup);
const routeToggle = document.getElementById('routes');
routeToggle.addEventListener('change', e => { routeGroup.visible = e.target.checked; });

// openclimbing's own ramp, from src/services/tagging/climbing/gradeData.ts (dark mode).
// Keyed on UIAA; the ramp is flat within a tier, so only the tier boundaries are listed.
const GRADE_TIERS = [['1-', 0x10adb2], ['4-', 0x7dd100], ['6-', 0xefca00],
                     ['8-', 0xff8f1f], ['10-', 0xc9203c]];
const DEFAULT_ROUTE_COLOR = 0x555555;

function gradeColor(grade, system) {
  if (!grade || (system && system !== 'uiaa')) return DEFAULT_ROUTE_COLOR;
  const n = parseInt(grade.replace('~', ''), 10);
  if (!Number.isFinite(n)) return DEFAULT_ROUTE_COLOR;
  let c = DEFAULT_ROUTE_COLOR;
  for (const [tier, colour] of GRADE_TIERS) if (n >= parseInt(tier, 10)) c = colour;
  return c;
}

// openclimbing draws each path twice: a wider stroke in the contrasting colour, then the grade
// colour on top of it. Without that outline the ungraded grey is invisible against grey rock.
function contrastColor(hex) {
  const lum = ch => { const v = ch / 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const L = 0.2126 * lum(hex >> 16 & 255) + 0.7152 * lum(hex >> 8 & 255) + 0.0722 * lum(hex & 255);
  return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? 0x000000 : 0xffffff;
}

function fatLine(pts, colour, width, order) {
  const geom = new LineGeometry();
  geom.setPositions(pts.flatMap(p => [p.x, p.y, p.z]));
  const lm = new LineMaterial({ color: colour, linewidth: width });
  lm.resolution.set(innerWidth, innerHeight);
  lineMaterials.push(lm);
  const line = new Line2(geom, lm);
  line.computeLineDistances();
  line.renderOrder = order;
  return line;
}

// The outline is the same polyline as the line it outlines, so the two z-fight and the line breaks
// into dashes. polygonOffset only papers over it — the depth error grows as you zoom in and the
// dashes come back. Instead the whole outline group is scaled about the camera: every point moves
// straight away from the eye, which leaves the screen position untouched but puts real distance
// between the two strokes. The step is capped so the outline never sinks into the rock the kernel
// lifted the line off.
const outlineGroup = new THREE.Group();
let outlineMaxStep = 0;

function pushOutlineBack() {
  const d = camera.position.distanceTo(controls.target);
  const eps = Math.min(0.002, outlineMaxStep / Math.max(d, 1e-6));
  outlineGroup.scale.setScalar(1 + eps);
  outlineGroup.position.copy(camera.position).multiplyScalar(-eps);
}

const routeLabels = [];
const lineMaterials = [];
const namesBox = document.getElementById('routeNames');

// The points trace the rock closely enough to pick up its noise, which reads as a zigzag. Two
// binomial passes take that out; each moves a point by a fraction of the local wobble — centimetres
// against the ~30 cm the kernel lifted the line by, so it cannot push it back into the wall.
function smooth(pts, passes) {
  let p = pts.map(v => v.clone());
  for (let k = 0; k < passes; k++) {
    const q = p.map(v => v.clone());
    for (let i = 1; i < p.length - 1; i++) {
      q[i].copy(p[i - 1]).addScaledVector(p[i], 2).add(p[i + 1]).multiplyScalar(0.25);
    }
    p = q;
  }
  return p.length > 2 ? new THREE.CatmullRomCurve3(p, false, 'centripetal').getPoints(p.length * 3) : p;
}

function buildRoutes(meta, sceneSize) {
  const anchors = [];
  routeGroup.add(outlineGroup);
  outlineMaxStep = sceneSize * 0.002;   // half the clearance the kernel lifted the line by
  for (const r of meta.routes) {
    // the points already carry their clearance above the rock — the kernel lifts them along the
    // surface normal and verifies each one against the mesh, so nothing is offset here
    const raw = r.points.map(p => new THREE.Vector3(...p));
    const pts = smooth(raw, 2);
    // the world is y-down, so the largest y is the foot of the route: the label hangs there and
    // stays there, rather than sliding along the line as the view changes
    const foot = pts.reduce((a, b) => (b.y > a.y ? b : a));
    routeLabels.push({ name: r.name, grade: r.grade || '–', foot, osmId: r.osmId,
                       colour: '#' + gradeColor(r.grade, r.gradeSystem).toString(16).padStart(6, '0') });
    // LineBasicMaterial ignores linewidth on almost every platform, so use the fat-line addon
    const colour = gradeColor(r.grade, r.gradeSystem);
    outlineGroup.add(fatLine(pts, contrastColor(colour), 4.5, 1));
    routeGroup.add(fatLine(pts, colour, 3, 2));
    // node indices address the points as they came from the kernel, not the resampled curve
    const nodes = r.nodes || (r.types || []).map((t, i) => ({ index: i, type: t }));
    for (const n of nodes) if (n.type === 'anchor' && raw[n.index]) anchors.push(raw[n.index]);
  }
  if (anchors.length) {
    const g = new THREE.SphereGeometry(sceneSize * 0.0022, 12, 8);
    const m = new THREE.MeshBasicMaterial({ color: 0x69d17c });
    const inst = new THREE.InstancedMesh(g, m, anchors.length);
    const mat4 = new THREE.Matrix4();
    anchors.forEach((p, i) => inst.setMatrixAt(i, mat4.makeTranslation(p.x, p.y, p.z)));
    inst.instanceMatrix.needsUpdate = true;
    routeGroup.add(inst);
  }
  routeToggle.parentElement.lastChild.textContent = ` show climbing routes (${meta.routes.length})`;
}

// ---- route labels ---------------------------------------------------------
// Drawn on a 2D overlay rather than as sprites, so they can be laid out against each other:
// the routes start within a few metres of one another, and 13 sprites at that spacing are an
// unreadable pile. A label is drawn only if its box is clear of the ones already placed, so
// zooming in — which spreads the starts apart on screen — reveals the rest one by one. The
// name is a second pass over the same boxes: it only appears where it fits without pushing
// anything else out, which in practice means zoomed right in on a single route.
const labelCanvas = document.getElementById('labels');
const lg = labelCanvas.getContext('2d');
const FONT = 13, PAD = 6, GAP = 4, OFFSET = 12;

function sizeLabels() {
  const dpr = Math.min(devicePixelRatio, 2);
  labelCanvas.width = innerWidth * dpr;
  labelCanvas.height = innerHeight * dpr;
  labelCanvas.style.width = innerWidth + 'px';
  labelCanvas.style.height = innerHeight + 'px';
  lg.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeLabels();

const overlaps = (a, b) => a.x < b.x + b.w + GAP && a.x + a.w + GAP > b.x &&
                           a.y < b.y + b.h + GAP && a.y + a.h + GAP > b.y;

function drawLabels() {
  lg.clearRect(0, 0, innerWidth, innerHeight);
  if (!routeGroup.visible || !namesBox.checked || !routeLabels.length) return;
  lg.font = `600 ${FONT}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;

  const v = new THREE.Vector3();
  const cand = [];
  for (const r of routeLabels) {
    v.copy(r.foot).project(camera);
    if (v.z > 1 || Math.abs(v.x) > 1 || Math.abs(v.y) > 1) continue;
    cand.push({ r, x: (v.x * 0.5 + 0.5) * innerWidth, y: (0.5 - v.y * 0.5) * innerHeight, z: v.z });
  }
  cand.sort((a, b) => a.z - b.z);          // nearest routes get first claim on the space

  const box = (c, text) => {
    const w = lg.measureText(text).width + PAD * 2, h = FONT + PAD * 2 - 2;
    return { w, h, text, x: c.x - w / 2, y: c.y + OFFSET };
  };
  const placed = [];
  for (const c of cand) {
    const b = box(c, c.r.grade);
    if (placed.some(p => overlaps(b, p))) continue;
    placed.push(Object.assign(b, { colour: c.r.colour, c }));
  }
  for (const b of placed) {
    if (!b.c.r.name) continue;
    const wide = box(b.c, `${b.c.r.name}  ${b.c.r.grade}`);
    if (!placed.some(p => p !== b && overlaps(wide, p))) Object.assign(b, wide);
  }
  hitBoxes = placed;

  for (const b of placed) {
    lg.fillStyle = 'rgba(12,15,20,0.82)';
    lg.strokeStyle = b.colour;
    lg.lineWidth = 1;
    lg.beginPath();
    lg.roundRect(b.x, b.y, b.w, b.h, 5);
    lg.fill();
    lg.globalAlpha = 0.55; lg.stroke(); lg.globalAlpha = 1;
    lg.fillStyle = b.colour;
    lg.textBaseline = 'middle';
    lg.fillText(b.text, b.x + PAD, b.y + b.h / 2 + 0.5);
  }
}

// A label opens the route on openclimbing. The overlay canvas stays pointer-transparent so it
// never steals a drag from the controls; instead the click is hit-tested against the boxes drawn
// last frame, and only counts if the pointer barely moved — otherwise every orbit ending on a
// label would navigate away.
let hitBoxes = [];
const labelAt = e => (namesBox.checked && routeGroup.visible)
  ? hitBoxes.find(b => e.clientX >= b.x && e.clientX <= b.x + b.w &&
                       e.clientY >= b.y && e.clientY <= b.y + b.h)
  : undefined;
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  const moved = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4;
  down = null;
  if (moved || e.button !== 0) return;
  const b = labelAt(e);
  if (b && b.c.r.osmId) open(`https://openclimbing.org/node/${b.c.r.osmId}`, '_blank', 'noopener');
});
renderer.domElement.addEventListener('pointermove', e => {
  renderer.domElement.style.cursor = labelAt(e) ? 'pointer' : '';
});

// ---- bolt overlay ---------------------------------------------------------
const boltGroup = new THREE.Group();
boltGroup.visible = false;
scene.add(boltGroup);
const boltToggle = document.getElementById('bolts');
boltToggle.addEventListener('change', e => { boltGroup.visible = e.target.checked; });

// confirmed bolts are solid red, single-view candidates a dimmer yellow
const unconfirmedGroup = new THREE.Group();
unconfirmedGroup.visible = false;
boltGroup.add(unconfirmedGroup);
const unconfirmedToggle = document.getElementById('unconfirmed');
unconfirmedToggle.addEventListener('change', e => { unconfirmedGroup.visible = e.target.checked; });

function markers(parent, positions, sceneSize, colour, opacity) {
  const r = sceneSize * 0.004;
  const m = new THREE.Matrix4();
  const core = new THREE.InstancedMesh(
    new THREE.SphereGeometry(r, 16, 12),
    new THREE.MeshBasicMaterial({ color: colour, transparent: opacity < 1, opacity }),
    positions.length);
  const halo = new THREE.InstancedMesh(
    new THREE.SphereGeometry(r * 2.2, 12, 8),
    new THREE.MeshBasicMaterial({ color: colour, transparent: true, opacity: opacity * 0.22,
                                  depthTest: false }),
    positions.length);
  positions.forEach((p, i) => { m.makeTranslation(...p); core.setMatrixAt(i, m); halo.setMatrixAt(i, m); });
  core.instanceMatrix.needsUpdate = true;
  halo.instanceMatrix.needsUpdate = true;
  halo.renderOrder = 2;
  parent.add(core, halo);
}

function buildBolts(meta, rejected, sceneSize) {
  markers(boltGroup, meta.bolts.map(b => b.position), sceneSize, 0xff5a3c, 1.0);
  boltToggle.parentElement.lastChild.textContent = ` show bolts (${meta.bolts.length} confirmed)`;
  if (rejected && rejected.bolts.length) {
    markers(unconfirmedGroup, rejected.bolts.map(b => b.position), sceneSize, 0xffd479, 0.75);
    unconfirmedToggle.parentElement.lastChild.textContent =
      `\u00a0include unconfirmed (${rejected.bolts.length}, single view only)`;
  } else {
    document.getElementById('unconfirmedRow').style.display = 'none';
  }
}

// ---- camera overlay -------------------------------------------------------
const camGroup = new THREE.Group();
camGroup.visible = false;
scene.add(camGroup);
const camToggle = document.getElementById('cams');
camToggle.addEventListener('change', e => { camGroup.visible = e.target.checked; });

function buildCameras(meta, sceneSize) {
  // one frustum per photo, drawn as lines, plus a dot at each shutter position
  const len = sceneSize * 0.035;
  const lineVerts = [];
  const dots = [];
  for (const c of meta.cameras) {
    const p = new THREE.Vector3().fromArray(c.position);
    const right = new THREE.Vector3().fromArray(c.right);
    const down = new THREE.Vector3().fromArray(c.down);
    const fwd = new THREE.Vector3().fromArray(c.forward);
    const hw = Math.tan(c.hfov / 2) * len;
    const hh = hw / c.aspect;
    // four corners of the image plane, in world space
    const corner = (sx, sy) => new THREE.Vector3()
      .copy(p)
      .addScaledVector(fwd, len)
      .addScaledVector(right, sx * hw)
      .addScaledVector(down, sy * hh);
    const c00 = corner(-1, -1), c10 = corner(1, -1), c11 = corner(1, 1), c01 = corner(-1, 1);
    for (const [a, b] of [[p, c00], [p, c10], [p, c11], [p, c01],
                          [c00, c10], [c10, c11], [c11, c01], [c01, c00]]) {
      lineVerts.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    dots.push(p.x, p.y, p.z);
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lineVerts, 3));
  camGroup.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
    color: 0x6ea8fe, transparent: true, opacity: 0.55, depthTest: true })));

  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dots, 3));
  camGroup.add(new THREE.Points(dg, new THREE.PointsMaterial({
    color: 0xffd479, size: sceneSize * 0.006, sizeAttenuation: true })));

  camToggle.parentElement.lastChild.textContent = ` show camera positions (${meta.cameras.length})`;
}

// ---- tile streaming -------------------------------------------------------
// A quadtree over the wall's UV frame. Each node carries its own decimated geometry, its own
// texture crop and a measured geometric error; the viewer walks the tree every frame, turns that
// error into a screen-space error and refines only where the screen can resolve the difference.
// A node is drawn until *all* of its visible children have arrived, so refinement never punches
// holes — the same "replacement refinement with parent fallback" 3D Tiles uses.
const tileGroup = new THREE.Group();
scene.add(tileGroup);
window.__tileGroup = tileGroup;   // so a test harness can see which levels are on screen
const loader = new THREE.TextureLoader();
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

let TILES = null, ROOTS = [], VERSION = '';
const stats = { loaded: 0, bytes: 0, drawn: 0, tris: 0, inflight: 0 };
const streamEl = document.getElementById('stream');

function boxOf(t) {
  return new THREE.Box3(new THREE.Vector3(...t.min), new THREE.Vector3(...t.max));
}

function parseTile(buf) {
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x334E524B) throw new Error('bad tile magic');
  const nv = dv.getUint32(8, true), nt = dv.getUint32(12, true), ib = dv.getUint32(16, true);
  let o = 20;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, o, nv * 3), 3));
  o += nv * 12;
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(buf, o, nv * 3), 3));
  o += nv * 12;
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(buf, o, nv * 2), 2));
  o += nv * 8;
  g.setIndex(new THREE.BufferAttribute(
    ib === 2 ? new Uint16Array(buf, o, nt * 3) : new Uint32Array(buf, o, nt * 3), 1));
  return { geometry: g, tris: nt, bytes: buf.byteLength };
}

const queue = [];
function request(t) {
  if (t.state) return;
  t.state = 'queued';
  queue.push(t);
}

function pump() {
  while (stats.inflight < MAX_INFLIGHT && queue.length) {
    // nearest-first: the tile the viewer is most starved of gets the next socket
    queue.sort((a, b) => b.priority - a.priority);
    const t = queue.shift();
    t.state = 'loading';
    stats.inflight++;
    Promise.all([
      fetch(`${TILE_BASE}${t.key}.bin${VERSION}`).then(r => r.arrayBuffer()),
      new Promise(res => loader.load(`${TILE_BASE}${t.key}.jpg${VERSION}`, res, undefined, () => res(null))),
    ]).then(([buf, tex]) => {
      const { geometry, tris, bytes } = parseTile(buf);
      if (tex) {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = MAXANISO;
        tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      }
      // double-sided so the skirts that hide the cracks between levels are never back-facing
      const mat = new THREE.MeshStandardMaterial({
        map: tex, metalness: 0, roughness: 1, side: THREE.DoubleSide });
      if (!LIT) { mat.emissive = new THREE.Color(0xffffff); mat.emissiveMap = tex; }
      t.mesh = new THREE.Mesh(geometry, mat);
      t.mesh.frustumCulled = false;
      t.tris = tris;
      t.state = 'ready';
      meshes.push(t.mesh);
      stats.loaded++; stats.bytes += bytes;
    }).catch(() => { t.state = null; })
      .finally(() => { stats.inflight--; pump(); });
  }
}

const frustum = new THREE.Frustum();
const projScreen = new THREE.Matrix4();
let pixelsPerUnit = 1;

function nearestReady(t) {
  while (t && t.state !== 'ready') t = t.parent;
  return t;
}

function select(t, out, seen) {
  if (!frustum.intersectsBox(t.box)) return;
  const dist = Math.max(t.box.distanceToPoint(camera.position), 1e-4);
  t.priority = 1 / dist;
  const sse = t.error * pixelsPerUnit / dist;
  const kids = t.children;
  if (!kids.length || sse <= MAX_SSE) {
    request(t);
    const use = nearestReady(t);
    if (use && !seen.has(use)) { seen.add(use); out.push(use); }
    return;
  }
  const visible = kids.filter(c => frustum.intersectsBox(c.box));
  if (visible.length && visible.every(c => c.state === 'ready')) {
    for (const c of kids) select(c, out, seen);
  } else {
    for (const c of visible) request(c);
    request(t);
    const use = nearestReady(t);
    if (use && !seen.has(use)) { seen.add(use); out.push(use); }
  }
}

function updateTiles() {
  if (!TILES) return;
  projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projScreen);
  // an object of size s at distance d covers s * pixelsPerUnit / d pixels
  pixelsPerUnit = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));

  const out = [];
  const seen = new Set();
  for (const r of ROOTS) select(r, out, seen);

  const now = performance.now();
  for (const t of out) t.used = now;
  const keep = new Set(out);
  for (const child of [...tileGroup.children]) if (!keep.has(child.tile)) tileGroup.remove(child);
  let tris = 0;
  for (const t of out) {
    if (t.mesh.parent !== tileGroup) { t.mesh.tile = t; tileGroup.add(t.mesh); }
    tris += t.tris;
  }
  stats.drawn = out.length; stats.tris = tris;
  pump();
}

let lastEvict = 0;
function evict(now) {
  if (now - lastEvict < 5000) return;
  lastEvict = now;
  for (const key in TILES) {
    const t = TILES[key];
    if (t.state !== 'ready' || t.level <= 1 || !t.used || now - t.used < EVICT_AFTER) continue;
    t.mesh.geometry.dispose();
    if (t.mesh.material.map) t.mesh.material.map.dispose();
    t.mesh.material.dispose();
    const i = meshes.indexOf(t.mesh); if (i >= 0) meshes.splice(i, 1);
    t.mesh = null; t.state = null; t.used = 0;
    stats.loaded--;
  }
}

let statsAt = 0;
function drawStats(now) {
  if (now - statsAt < 250) return;
  statsAt = now;
  streamEl.innerHTML =
    `<b>${(stats.tris / 1e6).toFixed(2)} M</b> triangles on screen · <b>${stats.drawn}</b> tiles<br>` +
    `<b>${(stats.bytes / 1048576).toFixed(1)} MB</b> downloaded · ${stats.loaded} cached` +
    (stats.inflight ? ` · ${stats.inflight} loading` : '');
}

// ---- load -----------------------------------------------------------------
const metaPromise = fetch('../v2/korno_v2_cameras.json').then(r => (r.ok ? r.json() : null)).catch(() => null);
const boltPromise = fetch('../v2/korno_v2_bolts.json').then(r => (r.ok ? r.json() : null)).catch(() => null);
const rejectedPromise = fetch('../v2/korno_v2_bolts_rejected.json').then(r => (r.ok ? r.json() : null)).catch(() => null);
const routePromise = fetch('../v2/korno_v2_routes.json').then(r => (r.ok ? r.json() : null)).catch(() => null);

fetch(`${TILE_BASE}index.json`).then(r => r.json()).then(async index => {
  VERSION = index.version ? `?v=${index.version}` : '';
  TILES = {};
  for (const key in index.tiles) {
    const raw = index.tiles[key];
    // keep the child keys aside: assigning `children: []` onto `raw` would wipe them first
    TILES[key] = { ...raw, key, box: boxOf(raw), childKeys: raw.children || [],
                   children: [], parent: null, state: null, mesh: null, used: 0, priority: 0 };
  }
  for (const key in TILES) {
    TILES[key].children = TILES[key].childKeys.map(k => TILES[k]).filter(Boolean);
    for (const c of TILES[key].children) c.parent = TILES[key];
  }
  ROOTS = index.roots.map(k => TILES[k]).filter(Boolean);

  const box = new THREE.Box3();
  for (const r of ROOTS) box.union(r.box);
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const halfV = Math.tan(Math.PI * 25 / 180);
  const dist = 1.12 * Math.max(size.y / 2 / halfV, size.x / 2 / (camera.aspect * halfV));
  camera.up.set(0, -1, 0);                 // the reconstruction's world is y-down
  camera.position.set(centre.x, centre.y, centre.z - dist);
  controls.target.copy(centre);
  controls.maxDistance = dist * 5;
  controls.update();

  const sceneSize = Math.max(size.x, size.y);
  const meta = await metaPromise;
  if (meta) buildCameras(meta, sceneSize); else camToggle.closest('label').style.display = 'none';
  const boltMeta = await boltPromise;
  if (boltMeta && boltMeta.bolts.length) buildBolts(boltMeta, await rejectedPromise, sceneSize);
  else { boltToggle.closest('label').style.display = 'none';
         document.getElementById('unconfirmedRow').style.display = 'none'; }
  const routeMeta = await routePromise;
  if (routeMeta && routeMeta.routes.length) buildRoutes(routeMeta, sceneSize);
  else { routeToggle.closest('label').style.display = 'none';
         document.getElementById('routeNamesRow').style.display = 'none'; }

  const total = Object.values(index.tiles).reduce((a, t) => a + t.tris, 0);
  document.getElementById('sub').textContent =
    `${(total / 1e6).toFixed(1)}M triangles in ${Object.keys(index.tiles).length} tiles` +
    `${meta ? ` · ${meta.cameras.length} photos` : ''}` +
    `${routeMeta ? ` · ${routeMeta.count} routes` : ''}`;

  // hold the spinner until the roots are up, so the first frame is never an empty scene
  for (const r of ROOTS) request(r);
  pump();
  const wait = setInterval(() => {
    const n = ROOTS.filter(r => r.state === 'ready').length;
    barEl.style.width = `${100 * n / ROOTS.length}%`;
    msgEl.textContent = `loading… ${n} / ${ROOTS.length} base tiles`;
    if (n === ROOTS.length) { clearInterval(wait); statusEl.classList.add('hidden'); }
  }, 100);
}).catch(err => {
  console.error(err);
  document.getElementById('bar').style.display = 'none';
  msgEl.className = 'error';
  msgEl.textContent = `Could not load ${TILE_BASE}index.json — pass ?tiles=<url> to point at the tile host`;
});

renderer.setAnimationLoop(() => {
  controls.update();
  updateTiles();
  pushOutlineBack();
  renderer.render(scene, camera);
  drawLabels();
  const now = performance.now();
  evict(now);
  drawStats(now);
});
</script>
</body>
</html>
