<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Korno rockface v2 — photogrammetry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🧗%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed; overflow: hidden;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10; max-width: min(340px, calc(100vw - 24px));
         background: rgba(12, 15, 20, .72); backdrop-filter: blur(8px);
         border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px; padding: 12px 14px; }
  #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #hud p { margin: 0; color: #9aa3ad; font-size: 12.5px; }
  #hud label { display: block; margin-top: 9px; color: #c8cdd3; font-size: 12.5px; cursor: pointer;
               user-select: none; }
  #hud input { vertical-align: middle; margin-right: 6px; }
  #hint { margin-top: 9px; color: #6b7480; font-size: 12px; }
  #quality { margin-top: 6px; font-size: 12px; }
  #quality a { color: #8fb3e8; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; place-items: center; gap: 10px;
            text-align: center; z-index: 20; pointer-events: none; }
  #status.hidden { display: none; }
  #bar { width: 220px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #6ea8fe; transition: width .2s; }
  #msg { color: #9aa3ad; font-size: 13px; }
  #msg.error { color: #ff8b8b; max-width: 80vw; pointer-events: auto; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div id="hud">
  <h1>Korno rockface</h1>
  <p id="sub">dense photogrammetry</p>
  <label><input type="checkbox" id="cams"> show camera positions</label>
  <label><input type="checkbox" id="lit" checked> studio light</label>
  <p id="hint">Drag to orbit · right-drag to pan · scroll to zoom</p>
  <p id="quality"></p>
</div>

<div id="status"><div id="bar"><i></i></div><div id="msg">loading…</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const FILE = params.get('f') || 'korno_v2.glb';
const LIGHT = 'korno_v2_light.glb';
document.getElementById('quality').innerHTML = FILE === LIGHT
  ? '<a href="?">full detail (90 MB)</a>'
  : `<a href="?f=${LIGHT}">lighter version (11 MB)</a>`;

const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const barEl = document.querySelector('#bar i');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// the texture already carries the daylight it was shot in, so keep the added light gentle
const hemi = new THREE.HemisphereLight(0xffffff, 0x40505f, 2.0);
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(0.6, 1.2, -1.4);
scene.add(hemi, dir);

const meshes = [];
document.getElementById('lit').addEventListener('change', e => {
  const on = e.target.checked;
  hemi.intensity = on ? 2.0 : 0;
  dir.intensity = on ? 1.1 : 0;
  meshes.forEach(m => {
    m.material.emissive = new THREE.Color(on ? 0x000000 : 0xffffff);
    m.material.emissiveMap = on ? null : m.material.map;
    m.material.needsUpdate = true;
  });
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- camera overlay -------------------------------------------------------
const camGroup = new THREE.Group();
camGroup.visible = false;
scene.add(camGroup);
const camToggle = document.getElementById('cams');
camToggle.addEventListener('change', e => { camGroup.visible = e.target.checked; });

function buildCameras(meta, sceneSize) {
  // one frustum per photo, drawn as lines, plus a dot at each shutter position
  const len = sceneSize * 0.035;
  const lineVerts = [];
  const dots = [];
  for (const c of meta.cameras) {
    const p = new THREE.Vector3().fromArray(c.position);
    const right = new THREE.Vector3().fromArray(c.right);
    const down = new THREE.Vector3().fromArray(c.down);
    const fwd = new THREE.Vector3().fromArray(c.forward);
    const hw = Math.tan(c.hfov / 2) * len;
    const hh = hw / c.aspect;
    // four corners of the image plane, in world space
    const corner = (sx, sy) => new THREE.Vector3()
      .copy(p)
      .addScaledVector(fwd, len)
      .addScaledVector(right, sx * hw)
      .addScaledVector(down, sy * hh);
    const c00 = corner(-1, -1), c10 = corner(1, -1), c11 = corner(1, 1), c01 = corner(-1, 1);
    for (const [a, b] of [[p, c00], [p, c10], [p, c11], [p, c01],
                          [c00, c10], [c10, c11], [c11, c01], [c01, c00]]) {
      lineVerts.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    dots.push(p.x, p.y, p.z);
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lineVerts, 3));
  camGroup.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
    color: 0x6ea8fe, transparent: true, opacity: 0.55, depthTest: true })));

  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dots, 3));
  camGroup.add(new THREE.Points(dg, new THREE.PointsMaterial({
    color: 0xffd479, size: sceneSize * 0.006, sizeAttenuation: true })));

  camToggle.parentElement.lastChild.textContent = ` show camera positions (${meta.cameras.length})`;
}

// ---- load -----------------------------------------------------------------
const metaPromise = fetch('korno_v2_cameras.json')
  .then(r => (r.ok ? r.json() : null))
  .catch(() => null);

new GLTFLoader().load(FILE,
  async gltf => {
    const root = gltf.scene;
    scene.add(root);
    root.traverse(n => {
      if (!n.isMesh) return;
      meshes.push(n);
      n.material.metalness = 0;
      n.material.roughness = 1;
      n.material.side = THREE.DoubleSide;
      if (n.material.map) n.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    });

    const box = new THREE.Box3().setFromObject(root);
    const centre = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    // fit both axes: a wide wall in a wide window is limited by width, not height
    const halfV = Math.tan(Math.PI * 25 / 180);
    const dist = 1.12 * Math.max(size.y / 2 / halfV, size.x / 2 / (camera.aspect * halfV));
    camera.up.set(0, -1, 0);                 // the reconstruction's world is y-down
    camera.position.set(centre.x, centre.y, centre.z - dist);
    controls.target.copy(centre);
    controls.maxDistance = dist * 5;
    controls.update();

    let tris = 0;
    root.traverse(n => { if (n.isMesh) tris += n.geometry.index.count / 3; });

    const meta = await metaPromise;
    if (meta) buildCameras(meta, Math.max(size.x, size.y));
    else camToggle.closest('label').style.display = 'none';

    document.getElementById('sub').textContent =
      `${(tris / 1e6).toFixed(2)}M triangles${meta ? ` · ${meta.cameras.length} photos` : ''}`;
    statusEl.classList.add('hidden');
  },
  ev => {
    if (ev.lengthComputable) {
      barEl.style.width = (100 * ev.loaded / ev.total) + '%';
      msgEl.textContent = `loading… ${(ev.loaded / 1048576).toFixed(0)} / ${(ev.total / 1048576).toFixed(0)} MB`;
    } else {
      msgEl.textContent = `loading… ${(ev.loaded / 1048576).toFixed(0)} MB`;
    }
  },
  err => {
    console.error(err);
    document.getElementById('bar').style.display = 'none';
    msgEl.className = 'error';
    msgEl.textContent = 'Could not load ' + FILE;
  });

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
